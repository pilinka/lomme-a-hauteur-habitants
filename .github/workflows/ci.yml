name: Qualité du socle V4

on:
  push:
    branches: ['v4/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgresql-rls:
    name: Migrations PostgreSQL et matrice RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Extraire le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Préparer les primitives Auth minimales
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/bootstrap.sql
      - name: Rejouer les migrations sur une base propre
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Exécuter la matrice RLS transactionnelle
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/lot2_rls.sql
      - name: Vérifier le rollback des données synthétiques
        run: |
          test "$(psql --tuples-only --no-align --command \
            'select count(*) from auth.users')" = "0"
          test "$(psql --tuples-only --no-align --command \
            'select count(*) from core.organizations')" = "0"

  quality:
    name: Qualité, contrats et sécurité
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Extraire le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:architecture
      - run: npm run test:database-contracts
      - run: npm run test:contrast
      - run: npm run security:secrets -- --history
      - run: npm test -- --coverage
      - run: npm run build
      - run: npm run test:fixtures
      - run: npm audit --audit-level=high

  e2e-accessibility:
    name: Parcours navigateur et accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Extraire le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
